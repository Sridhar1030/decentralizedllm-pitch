<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 268" width="900" height="268" role="img"
     aria-label="DecentralizedLLM architecture: one model split by layer across three devices">
<rect width="900" height="268" rx="8" fill="#0d1420"/>
<text x="30" y="30" fill="#e9eff6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600">DecentralizedLLM &#8212; one model, three devices</text>
<text x="30" y="49" fill="#5d7186" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">Each device holds a contiguous range of layers. No device holds the whole model.</text>
<rect x="30" y="88" width="100" height="52" rx="4" fill="none" stroke="#26323e" stroke-width="1.5">
</rect>
<text x="40" y="107" fill="#5d7186" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">coordinator</text>
<line x1="80.0" y1="140" x2="80.0" y2="158" stroke="#26323e" stroke-width="1"/>
<rect x="150" y="88" width="120" height="52" rx="4" fill="none" stroke="#26323e" stroke-width="1.5">
<animate attributeName="stroke" dur="2.6s" repeatCount="indefinite" keyTimes="0;0.137;0.207;0.277;1" values="#26323e;#26323e;#2dd4bf;#26323e;#26323e"/>
<animate attributeName="stroke-width" dur="2.6s" repeatCount="indefinite" keyTimes="0;0.137;0.207;0.277;1" values="1.5;1.5;2.5;1.5;1.5"/>
</rect>
<text x="160" y="107" fill="#2dd4bf" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">node0</text>
<text x="160" y="128" fill="#5d7186" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5">embed + L0-10</text>
<line x1="210.0" y1="140" x2="210.0" y2="158" stroke="#26323e" stroke-width="1"/>
<rect x="330" y="88" width="120" height="52" rx="4" fill="none" stroke="#26323e" stroke-width="1.5">
<animate attributeName="stroke" dur="2.6s" repeatCount="indefinite" keyTimes="0;0.357;0.427;0.497;1" values="#26323e;#26323e;#8f8ffb;#26323e;#26323e"/>
<animate attributeName="stroke-width" dur="2.6s" repeatCount="indefinite" keyTimes="0;0.357;0.427;0.497;1" values="1.5;1.5;2.5;1.5;1.5"/>
</rect>
<text x="340" y="107" fill="#8f8ffb" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">node1</text>
<text x="340" y="128" fill="#5d7186" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5">L11-21</text>
<line x1="390.0" y1="140" x2="390.0" y2="158" stroke="#26323e" stroke-width="1"/>
<rect x="510" y="88" width="120" height="52" rx="4" fill="none" stroke="#26323e" stroke-width="1.5">
<animate attributeName="stroke" dur="2.6s" repeatCount="indefinite" keyTimes="0;0.576;0.646;0.716;1" values="#26323e;#26323e;#f472a6;#26323e;#26323e"/>
<animate attributeName="stroke-width" dur="2.6s" repeatCount="indefinite" keyTimes="0;0.576;0.646;0.716;1" values="1.5;1.5;2.5;1.5;1.5"/>
</rect>
<text x="520" y="107" fill="#f472a6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">node2</text>
<text x="520" y="128" fill="#5d7186" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5">L22-23 + lm_head</text>
<line x1="570.0" y1="140" x2="570.0" y2="158" stroke="#26323e" stroke-width="1"/>
<rect x="690" y="88" width="180" height="52" rx="4" fill="none" stroke="#26323e" stroke-width="1.5">
</rect>
<text x="700" y="107" fill="#5d7186" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">token out</text>
<line x1="780.0" y1="140" x2="780.0" y2="158" stroke="#26323e" stroke-width="1"/>
<line x1="40" y1="158" x2="860" y2="158" stroke="#26323e" stroke-width="2"/>
<g><rect x="-7" y="-9" width="14" height="18" rx="2.5" fill="#4ade80"/><animateMotion dur="2.6s" repeatCount="indefinite" path="M 40,158 L 860,158"/></g>
<text x="860" y="149" text-anchor="end" fill="#4ade80" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5">1,792 B per hop, the same on every token &#183; 4 B comes back</text>
<line x1="30" y1="192" x2="860" y2="192" stroke="#26323e" stroke-width="1"/>
<text x="30" y="224" fill="#f0a83c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="600">4</text>
<text x="30" y="243" fill="#8aa0b5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">wire crossings per token</text>
<text x="238" y="224" fill="#f0a83c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="600">12 KB</text>
<text x="238" y="243" fill="#8aa0b5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">KV cache per token, whole model</text>
<text x="446" y="224" fill="#f0a83c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="600">11 / 11 / 11</text>
<text x="446" y="243" fill="#8aa0b5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">layer-equivalents per device</text>
<text x="654" y="224" fill="#f0a83c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="600">~100%</text>
<text x="654" y="243" fill="#8aa0b5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">utilisation at 3 in flight</text>
</svg>
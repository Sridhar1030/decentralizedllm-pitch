<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 386" width="900" height="386" role="img"
     aria-label="DecentralizedLLM: one model split across three nodes, v0 star routing versus v1 chain routing">
<rect width="900" height="386" rx="8" fill="#0d1420"/>
<text x="30" y="30" fill="#e9eff6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600">DecentralizedLLM &#8212; one model, three machines</text>
<text x="30" y="49" fill="#5d7186" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">Qwen2.5-0.5B, 24 layers cut into 3 shards. No node holds the full model.</text>
<text x="30" y="78" fill="#e9eff6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600">v0</text>
<text x="56" y="78" fill="#8aa0b5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">star-routed: the coordinator relays every hop, fp32 + base64 + JSON</text>
<rect x="30" y="90" width="100" height="52" rx="4" fill="none" stroke="#26323e" stroke-width="1.5">
</rect>
<text x="40" y="109" fill="#5d7186" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">coordinator</text>
<line x1="80.0" y1="142" x2="80.0" y2="162" stroke="#26323e" stroke-width="1"/>
<rect x="150" y="90" width="120" height="52" rx="4" fill="none" stroke="#26323e" stroke-width="1.5">
<animate attributeName="stroke" dur="6s" repeatCount="indefinite" keyTimes="0;0.117;0.167;0.217;1" values="#26323e;#26323e;#2dd4bf;#26323e;#26323e"/>
<animate attributeName="stroke-width" dur="6s" repeatCount="indefinite" keyTimes="0;0.117;0.167;0.217;1" values="1.5;1.5;2.5;1.5;1.5"/>
</rect>
<text x="160" y="109" fill="#2dd4bf" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">node0</text>
<text x="160" y="130" fill="#5d7186" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5">embed + L0-7</text>
<line x1="210.0" y1="142" x2="210.0" y2="162" stroke="#26323e" stroke-width="1"/>
<rect x="330" y="90" width="120" height="52" rx="4" fill="none" stroke="#26323e" stroke-width="1.5">
<animate attributeName="stroke" dur="6s" repeatCount="indefinite" keyTimes="0;0.450;0.500;0.550;1" values="#26323e;#26323e;#8f8ffb;#26323e;#26323e"/>
<animate attributeName="stroke-width" dur="6s" repeatCount="indefinite" keyTimes="0;0.450;0.500;0.550;1" values="1.5;1.5;2.5;1.5;1.5"/>
</rect>
<text x="340" y="109" fill="#8f8ffb" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">node1</text>
<text x="340" y="130" fill="#5d7186" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5">L8-15</text>
<line x1="390.0" y1="142" x2="390.0" y2="162" stroke="#26323e" stroke-width="1"/>
<rect x="510" y="90" width="120" height="52" rx="4" fill="none" stroke="#26323e" stroke-width="1.5">
<animate attributeName="stroke" dur="6s" repeatCount="indefinite" keyTimes="0;0.783;0.833;0.883;1" values="#26323e;#26323e;#f472a6;#26323e;#26323e"/>
<animate attributeName="stroke-width" dur="6s" repeatCount="indefinite" keyTimes="0;0.783;0.833;0.883;1" values="1.5;1.5;2.5;1.5;1.5"/>
</rect>
<text x="520" y="109" fill="#f472a6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">node2</text>
<text x="520" y="130" fill="#5d7186" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5">L16-23 + lm_head</text>
<line x1="570.0" y1="142" x2="570.0" y2="162" stroke="#26323e" stroke-width="1"/>
<rect x="690" y="90" width="180" height="52" rx="4" fill="none" stroke="#26323e" stroke-width="1.5">
</rect>
<text x="700" y="109" fill="#5d7186" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">token out</text>
<line x1="780.0" y1="142" x2="780.0" y2="162" stroke="#26323e" stroke-width="1"/>
<line x1="40" y1="162" x2="860" y2="162" stroke="#26323e" stroke-width="2"/>
<g><rect x="-11.0" y="-9" width="22" height="18" rx="2.5" fill="#fb7185"><animate attributeName="width" dur="6s" repeatCount="indefinite" values="22;108"/></rect><animateMotion dur="6s" repeatCount="indefinite" path="M 40,162 L 210.0,162 L 40,162 L 390.0,162 L 40,162 L 570.0,162 L 40,162"/></g>
<text x="860" y="153" text-anchor="end" fill="#fb7185" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5">3 POSTs = 6 wire crossings, payload grows every token</text>
<text x="30" y="206" fill="#e9eff6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600">v1</text>
<text x="56" y="206" fill="#8aa0b5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">chain-routed: nodes hand off directly, bf16 in a binary DLP frame</text>
<rect x="30" y="218" width="100" height="52" rx="4" fill="none" stroke="#26323e" stroke-width="1.5">
</rect>
<text x="40" y="237" fill="#5d7186" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">coordinator</text>
<line x1="80.0" y1="270" x2="80.0" y2="290" stroke="#26323e" stroke-width="1"/>
<rect x="150" y="218" width="120" height="52" rx="4" fill="none" stroke="#26323e" stroke-width="1.5">
<animate attributeName="stroke" dur="2.4s" repeatCount="indefinite" keyTimes="0;0.137;0.207;0.277;1" values="#26323e;#26323e;#2dd4bf;#26323e;#26323e"/>
<animate attributeName="stroke-width" dur="2.4s" repeatCount="indefinite" keyTimes="0;0.137;0.207;0.277;1" values="1.5;1.5;2.5;1.5;1.5"/>
</rect>
<text x="160" y="237" fill="#2dd4bf" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">node0</text>
<text x="160" y="258" fill="#5d7186" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5">embed + L0-10</text>
<line x1="210.0" y1="270" x2="210.0" y2="290" stroke="#26323e" stroke-width="1"/>
<rect x="330" y="218" width="120" height="52" rx="4" fill="none" stroke="#26323e" stroke-width="1.5">
<animate attributeName="stroke" dur="2.4s" repeatCount="indefinite" keyTimes="0;0.357;0.427;0.497;1" values="#26323e;#26323e;#8f8ffb;#26323e;#26323e"/>
<animate attributeName="stroke-width" dur="2.4s" repeatCount="indefinite" keyTimes="0;0.357;0.427;0.497;1" values="1.5;1.5;2.5;1.5;1.5"/>
</rect>
<text x="340" y="237" fill="#8f8ffb" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">node1</text>
<text x="340" y="258" fill="#5d7186" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5">L11-21</text>
<line x1="390.0" y1="270" x2="390.0" y2="290" stroke="#26323e" stroke-width="1"/>
<rect x="510" y="218" width="120" height="52" rx="4" fill="none" stroke="#26323e" stroke-width="1.5">
<animate attributeName="stroke" dur="2.4s" repeatCount="indefinite" keyTimes="0;0.576;0.646;0.716;1" values="#26323e;#26323e;#f472a6;#26323e;#26323e"/>
<animate attributeName="stroke-width" dur="2.4s" repeatCount="indefinite" keyTimes="0;0.576;0.646;0.716;1" values="1.5;1.5;2.5;1.5;1.5"/>
</rect>
<text x="520" y="237" fill="#f472a6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">node2</text>
<text x="520" y="258" fill="#5d7186" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5">L22-23 + lm_head</text>
<line x1="570.0" y1="270" x2="570.0" y2="290" stroke="#26323e" stroke-width="1"/>
<rect x="690" y="218" width="180" height="52" rx="4" fill="none" stroke="#26323e" stroke-width="1.5">
</rect>
<text x="700" y="237" fill="#5d7186" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">token out</text>
<line x1="780.0" y1="270" x2="780.0" y2="290" stroke="#26323e" stroke-width="1"/>
<line x1="40" y1="290" x2="860" y2="290" stroke="#26323e" stroke-width="2"/>
<g><rect x="-6.0" y="-9" width="12" height="18" rx="2.5" fill="#4ade80"></rect><animateMotion dur="2.4s" repeatCount="indefinite" path="M 40,290 L 860,290"/></g>
<text x="860" y="281" text-anchor="end" fill="#4ade80" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5">4 crossings &#183; 1,792 B per hop, constant &#183; 4 B back</text>
<line x1="30" y1="302" x2="860" y2="302" stroke="#26323e" stroke-width="1"/>
<text x="490" y="316" text-anchor="end" fill="#5d7186" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5">V0 AS WRITTEN</text>
<text x="672" y="316" text-anchor="end" fill="#5d7186" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5">V1 FOUR LEVERS</text>
<text x="860" y="316" text-anchor="end" fill="#5d7186" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5">CHANGE</text>
<text x="30" y="334" fill="#8aa0b5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">bytes on the wire, 512 tokens</text>
<text x="490" y="334" text-anchor="end" fill="#fb7185" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">1,821.7 MB</text>
<text x="672" y="334" text-anchor="end" fill="#4ade80" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">1.95 MB</text>
<text x="860" y="334" text-anchor="end" fill="#f0a83c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="600">935x less</text>
<text x="30" y="349" fill="#8aa0b5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">position-forwards per node</text>
<text x="490" y="349" text-anchor="end" fill="#fb7185" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">147,200</text>
<text x="672" y="349" text-anchor="end" fill="#4ade80" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">543</text>
<text x="860" y="349" text-anchor="end" fill="#f0a83c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="600">271x less</text>
<text x="30" y="364" fill="#8aa0b5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">wire crossings per token</text>
<text x="490" y="364" text-anchor="end" fill="#fb7185" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">6 (star)</text>
<text x="672" y="364" text-anchor="end" fill="#4ade80" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">4 (chain)</text>
<text x="860" y="364" text-anchor="end" fill="#f0a83c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="600">2 carry activations</text>
<text x="30" y="379" fill="#8aa0b5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">pipeline utilisation ceiling</text>
<text x="490" y="379" text-anchor="end" fill="#fb7185" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">33%</text>
<text x="672" y="379" text-anchor="end" fill="#4ade80" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">~100% at R=3</text>
<text x="860" y="379" text-anchor="end" fill="#f0a83c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="600">3x throughput</text>
</svg>